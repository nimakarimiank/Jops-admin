# Datasource configuration
spring:
  datasource:
    druid:
      db-type: com.alibaba.druid.pool.DruidDataSource
      driverClassName: com.p6spy.engine.spy.P6SpyDriver
      url: jdbc:p6spy:mysql://localhost:3306/eladmin-mp?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=false
      username: root
      password: 123456
      # Initial connection count, recommended to match min-idle
      initial-size: 20
      # Minimum idle connections to handle incoming requests
      min-idle: 20
      # Maximum connections, adjust based on concurrency demands
      max-active: 50
      # Connection timeout (ms), adjust to satisfy latency requirements
      max-wait: 3000
      # Enable KeepAlive mechanism to maintain persistent connections
      keep-alive: true
      # Validation interval (ms) to check connection health periodically
      time-between-eviction-runs-millis: 60000
      # Minimum evictable idle time (ms) for connections in pool
      min-evictable-idle-time-millis: 300000
      # Maximum evictable idle time (ms) to prevent lingering connections
      max-evictable-idle-time-millis: 900000
      # Validate connection during idle eviction; evicted if test fails
      test-while-idle: true
      # Validate connection before borrowing; evicted and retried if test fails
      test-on-borrow: true
      # Whether to validate connection before returning to pool
      test-on-return: false
      # Disable com_ping keep-alive probe
      use-ping-method: false
      # Validation query to test connection validity
      validation-query: SELECT 1
      # Monitor and statistics configuration
      webStatFilter:
        enabled: true
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: false
      filter:
        stat:
          enabled: true
          # Log slow SQL queries
          log-slow-sql: true
          slow-sql-millis: 2000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true

# Login configuration
login:
  #  Whether to restrict single user login
  single-login: false
  # Redis user login cache configuration
  user-cache:
    # Idle time / seconds
    idle-time: 21600
  #  Captcha configuration
  code:
    #  Captcha type configuration (refer to LoginProperties class)
    code-type: arithmetic
    #  Graphic captcha expiration / minutes
    expiration: 2
    #  Captcha width
    width: 111
    #  Captcha height
    height: 36
    # Captcha character length
    length: 2
    # Font name, leaves empty to use default font
    font-name:
    # Font size
    font-size: 25

#jwt
jwt:
  header: Authorization
  # Token prefix
  token-start-with: Bearer
  # Base64-encoded secret key must be at least 88 characters
  base64-secret: ZmQ0ZGI5NjQ0MDQwY2I4MjMxY2Y3ZmI3MjdhN2ZmMjNhODViOTg1ZGE0NTBjMGM4NDA5NzYxMjdjOWMwYWRmZTBlZjlhNGY3ZTg4Y2U3YTE1ODVkZDU5Y2Y3OGYwZWE1NzUzNWQ2YjFjZDc0NGMxZWU2MmQ3MjY1NzJmNTE0MzI=
  # Token expiration in milliseconds (default 4 hours); generate at https://www.convertworld.com/en/time/milliseconds.html
  token-validity-in-seconds: 14400000
  # Online user redis key
  online-key: "online_token:"
  # Captcha redis key
  code-key: "captcha_code:"
  # Token renewal check interval (default 30 min in ms); renews token if user is active near expiry
  detect: 1800000
  # Renewal validity duration (default 1 hour in ms)
  renew: 3600000

# Whether code generation is enabled (set false in production)
generator:
  enabled: true

# Whether to enable swagger-ui
swagger:
  enabled: true

# File storage paths
file:
  mac:
    path: ~/file/
    avatar: ~/avatar/
  linux:
    path: /home/eladmin/file/
    avatar: /home/eladmin/avatar/
  windows:
    path: C:\eladmin\file\
    avatar: C:\eladmin\avatar\
  # Max file size / MB
  maxSize: 100
  avatarMaxSize: 5

# Amazon S3 protocol cloud storage configuration
# Supports Qiniu Cloud, Alibaba Cloud OSS, Tencent Cloud COS, Huawei Cloud OBS, etc.
amz:
  s3:
    # Region
    region: test
    # Corresponding endpoint for region
    endPoint: https://s3.test.com
    # Access domain name
    domain: https://s3.test.com
    # Authentication credentials (access key / secret key)
    accessKey: Enter your AccessKey
    secretKey: Enter your SecretKey
    # Storage Bucket
    defaultBucket: Enter your Bucket name
    # File storage path format
    timeformat: yyyy-MM