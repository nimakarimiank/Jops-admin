# Quartz distributed configuration: import quartz SQL schema from sql/ directory, and set active: dev,quartz in application.yml
spring:
  quartz:
    # Required: specify JDBC job store
    job-store-type: jdbc
    properties:
      org:
        quartz:
          scheduler:
            # Required: specify scheduler instance name
            instanceName: eladmin
            # Required: specify scheduler instance ID
            instanceId: auto
          threadPool:
            # Optional: thread pool size, adjust as needed
            threadCount: 5
          jobStore:
            # Optional: remove if clustering is not needed
            isClustered: true
            # Optional: cluster check-in interval (ms), adjust as needed
            clusterCheckinInterval: 10000
            # Required: specify JDBC driver delegate class
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            # Optional: whether to use properties store, adjust as needed
            useProperties: false
            # Required: specify table prefix
            tablePrefix: qrtz_
            # Optional: misfire threshold (ms), adjust as needed
            misfireThreshold: 60000