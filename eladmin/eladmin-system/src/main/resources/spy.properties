# Interceptor modules to load
modulelist=com.baomidou.mybatisplus.extension.p6spy.MybatisPlusLogFactory,com.p6spy.engine.outage.P6OutageFactory
# Custom log message formatting
logMessageFormat=me.zhengjie.config.mybatis.CustomP6SpyLogger
# Log output appender to console
appender=com.baomidou.mybatisplus.extension.p6spy.StdoutLogger
# Date format
dateformat=yyyy-MM-dd HH:mm:ss
# Real underlying JDBC driver list (can be multiple)
driverlist=com.mysql.cj.jdbc.Driver
# Whether to enable slow SQL outage detection
outagedetection=true
# Slow SQL threshold (2 seconds)
outagedetectioninterval=2
# Whether to filter logs
filter=true
# Excluded SQL keywords when filtering logs, comma-separated
exclude=SELECT 1,INSERT INTO sys_log
# Excluded log categories: error, info, batch, debug, statement, commit, rollback, result, resultset
excludecategories=info,debug,result,commit,resultset